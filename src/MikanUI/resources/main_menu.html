<div class="main-menu">
    <h1>Main Menu</h1>
    <div class="menu-buttons">
        <button id="resume-project-btn" class="menu-button hidden">Resume Project</button>
        <button id="open-project-btn" class="menu-button">Open Project</button>
        <button id="new-project-btn" class="menu-button">New Project</button>
        <button id="launch-tutorial-btn" class="menu-button">Tutorial</button>
        <button id="exit-btn" class="menu-button">Exit</button>
    </div>
</div>

<style>
.main-menu {
    text-align: center;
    padding: 40px 20px;
}

.main-menu h1 {
    color: #4ec9b0;
    margin-bottom: 40px;
    font-size: 28px;
}

.menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
    max-width: 300px;
    margin: 0 auto;
}

.menu-button {
    padding: 15px 30px;
    font-size: 16px;
    background-color: #007acc;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    transform: scale(1.0);
}

.menu-button:hover {
    background-color: #005a9e;
    transform: scale(1.1);
}

.menu-button:active {
    transform: scale(0.95);
}

.menu-button.hidden {
    display: none;
}
</style>

<script>
// Menu button handlers
document.getElementById('resume-project-btn').addEventListener('click', () => {
    mikanWS.send('resume_project');
});

document.getElementById('open-project-btn').addEventListener('click', () => {
    mikanWS.send('open_project');
});

document.getElementById('new-project-btn').addEventListener('click', () => {
    mikanWS.send('new_project');
});

document.getElementById('launch-tutorial-btn').addEventListener('click', () => {
    mikanWS.send('launch_tutorial');
});

document.getElementById('exit-btn').addEventListener('click', () => {
    mikanWS.send('exit');
});

// Check if there's an existing project to show resume button
mikanWS.request('has_existing_project').then(response => {
    if (response && response.hasProject) {
        document.getElementById('resume-project-btn').classList.remove('hidden');
    }
}).catch(error => {
    console.error('Failed to check for existing project:', error);
});
</script>
