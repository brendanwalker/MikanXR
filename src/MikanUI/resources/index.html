<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikanUI</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
    {
        "imports": {
            "@mikanxr/client": "../../../../../bindings/typescript/dist/index.js",
            "events": "https://esm.sh/events@3.3.0"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <!-- Connection Panel -->
        <div id="connection-panel" class="panel">
            <h1>Mikan Connection</h1>
            <div class="form-group">
                <label for="server-url">Server URL:</label>
                <input type="text" id="server-url" value="ws://localhost:8080" />
            </div>
            <div id="status" class="status">Not connected</div>
            <div class="button-group">
                <button id="connect-btn">Connect</button>
                <button id="launch-btn">Launch Mikan</button>
            </div>
        </div>

        <!-- Main content (hidden until connected) -->
        <div id="main-content" class="panel hidden">
            <!-- Will be populated based on app stage -->
        </div>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
